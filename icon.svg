<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#14171A"/>
  <!-- Mumbai Sunset Orange Gradient -->
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#E55300" />
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>
  <!-- Road outline -->
  <path d="M 20 108 L 48 36 L 80 36 L 108 108 Z" fill="#22272E" stroke="#333C46" stroke-width="2"/>
  <line x1="64" y1="42" x2="64" y2="56" stroke="#FF8A00" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="68" x2="64" y2="86" stroke="#FF8A00" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="64" y1="96" x2="64" y2="106" stroke="#FF8A00" stroke-width="4" stroke-linecap="round"/>
  <!-- Stylized Sports Car silhouette -->
  <path d="M 38 88 C 38 82 46 76 64 76 C 82 76 90 82 90 88 L 92 93 C 92 96 89 98 85 98 L 43 98 C 39 98 36 96 36 93 Z" fill="url(#orangeGrad)"/>
  <ellipse cx="48" cy="98" rx="7" ry="7" fill="#0E1012" stroke="#64748B" stroke-width="2"/>
  <ellipse cx="80" cy="98" rx="7" ry="7" fill="#0E1012" stroke="#64748B" stroke-width="2"/>
  <!-- Windshield -->
  <path d="M 44 86 L 50 78 L 78 78 L 84 86 Z" fill="#0F172A" opacity="0.85"/>
  <!-- Headlights -->
  <circle cx="41" cy="90" r="2.5" fill="#FFF7ED"/>
  <circle cx="87" cy="90" r="2.5" fill="#FFF7ED"/>
  <!-- Text 'MUMBAI' -->
  <text x="64" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#FF8A00" text-anchor="middle" letter-spacing="2">MUMBAI</text>
</svg>

